name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Verify the report generator reproduces docs/RESULTS.md
        run: |
          inferlab report results/ --out /tmp/RESULTS.md
          diff -u docs/RESULTS.md /tmp/RESULTS.md \
            && echo "RESULTS.md is in sync with results/" \
            || echo "::warning::RESULTS.md differs from results/ -- run 'inferlab report results/*.json --out docs/RESULTS.md'"
