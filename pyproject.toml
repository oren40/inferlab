[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inferlab"
version = "0.1.0"
description = "Reproducible LLM inference benchmarking & optimization lab for single-GPU Blackwell"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Oren Peretz" }]
keywords = [
    "llm",
    "inference",
    "benchmark",
    "vllm",
    "sglang",
    "tensorrt-llm",
    "llama-cpp",
    "quantization",
    "nvfp4",
    "fp8",
    "kv-cache",
    "blackwell",
    "rtx-5090",
    "ai-infrastructure",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "aiohttp>=3.9",
    "pyyaml>=6.0",
    "rich>=13.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
bench = ["inferlab[all]"]
quality = ["inferlab[all]"]
all = ["inferlab"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
inferlab = "inferlab.cli:main"

[project.urls]
Homepage = "https://github.com/oren40/inferlab"
Documentation = "https://github.com/oren40/inferlab/blob/main/docs/METHODOLOGY.md"
Results = "https://github.com/oren40/inferlab/blob/main/docs/RESULTS.md"
LinkedIn = "https://www.linkedin.com/in/oren-peretz"

[tool.setuptools.packages.find]
include = ["inferlab*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
